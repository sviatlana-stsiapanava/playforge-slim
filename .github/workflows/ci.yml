name: ci
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      # .env is gitignored, so CI supplies the config the specs read via
      # framework/config/env.ts. Set BASE_URL as a repository variable.
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          prompt: |
            Review this pull request's changed test files by following the
            test-reviewer agent defined in this repository: CLAUDE.md routes
            to it at .claude/agents/test-reviewer.md (also the review step of
            .claude/workflows/create-test.yml). Post the reviewer's findings
            table and verdict as a PR comment. Do not edit any files.
